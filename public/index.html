    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
      gtag('set', 'ads_data_redaction', true);
    </script>

    <script>
      window.loadDomiAnalytics = function () {
        if (window.__domiAnalyticsLoaded) return;
        window.__domiAnalyticsLoaded = true;

        gtag('js', new Date());
        gtag('config', 'AW-16964586391');
        gtag('config', 'G-D36JEC3KD1');

        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=AW-16964586391';
        document.head.appendChild(script);
      };

      try {
        var savedConsent = JSON.parse(
          localStorage.getItem('domi_cookie_consent_v1') || 'null'
        );
        if (savedConsent && savedConsent.consent === 'granted') {
          window.loadDomiAnalytics();
        }
      } catch (error) {
        // The consent banner will handle unavailable storage.
      }
    </script>

    <script>
      function gtag_report_conversion(url) {
        var callback = function () {
          if (typeof url !== 'undefined') window.location = url;
        };
        gtag('event', 'conversion', {
          send_to: 'AW-16964586391/Z3h0CMnS4rMaEJeXrJk_',
          event_callback: callback
        });
        return false;
      }
    </script>
